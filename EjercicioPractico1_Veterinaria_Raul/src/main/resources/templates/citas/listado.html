<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <nav th:replace="~{general/fragmentos :: navbar}"></nav>

        <main class="container my-5">

            <div class="text-center mb-5">

                <h2 class="fw-bold" style="color: #198754;">

                    <i class="bi bi-calendar-check"></i>
                    Citas Programadas

                </h2>

                <p class="text-muted">
                    Consultá las citas veterinarias registradas
                    en nuestro sistema.
                </p>

            </div>

            <div class="row g-4">

                <div class="col-md-9">

                    <div class="card shadow-sm border-0">

                        <div class="card-header text-white"
                             style="background-color: #17A2B8;">

                            <h4 class="mb-0">

                                <i class="bi bi-calendar3"></i>
                                Listado de Citas

                            </h4>

                        </div>

                        <div class="card-body">

                            <div th:if="${citas != null and !citas.isEmpty()}">

                                <div class="table-responsive">

                                    <table class="table table-striped table-hover align-middle">

                                        <thead class="table-light">

                                            <tr>
                                                <th>ID</th>
                                                <th>Mascota</th>
                                                <th>Propietario</th>
                                                <th>Fecha</th>
                                                <th>Servicio</th>
                                            </tr>

                                        </thead>

                                        <tbody>

                                            <tr th:each="cita : ${citas}">

                                                <td th:text="${cita.id}"></td>

                                                <td>
                                                    <i class="bi bi-heart-fill text-danger"></i>

                                                    <span th:text="${cita.nombreMascota}"></span>
                                                </td>

                                                <td th:text="${cita.nombrePropietario}"></td>

                                                <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td>

                                                <td>
                                                    <span class="badge bg-success"
                                                          th:text="${cita.servicio.nombre}">
                                                    </span>
                                                </td>

                                            </tr>

                                        </tbody>

                                    </table>

                                </div>

                            </div>

                            <div th:if="${citas == null or citas.isEmpty()}"
                                 class="alert alert-info text-center">

                                <i class="bi bi-info-circle"></i>
                                No hay citas programadas actualmente.

                            </div>

                        </div>

                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card text-center text-white shadow-sm"
                         style="background-color: #198754;">

                        <div class="card-body">

                            <h5>Total de Citas</h5>

                            <h2 class="display-5">

                                <i class="bi bi-calendar-check"></i>

                                <span th:text="${citas != null ? #lists.size(citas) : 0}">
                                    0
                                </span>

                            </h2>

                        </div>

                    </div>

                    <div class="card mt-3 shadow-sm border-0">

                        <div class="card-body text-center">

                            <i class="bi bi-info-circle fs-2 text-info"></i>

                            <p class="text-muted mt-2 mb-0">
                                Esta sección es únicamente informativa.
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>

</html>
