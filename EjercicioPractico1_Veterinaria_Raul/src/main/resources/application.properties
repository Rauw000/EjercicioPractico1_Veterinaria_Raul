# Nombre de la aplicación
spring.application.name=ejercicioPractico1_veterinaria_Raul

# Puerto del servidor
server.port=8086

# Configuración de Thymeleaf
spring.thymeleaf.cache=false

# Configuración de MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_citas

# Usuario y contraseña de MySQL
spring.datasource.username=usuario_caso_practico_01_var
spring.datasource.password=123456

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# No modificar las tablas creadas por el profesor
spring.jpa.hibernate.ddl-auto=none

# Mostrar consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivar banner de Spring
spring.main.banner-mode=off

# Configuracion de mensajes
spring.messages.basename=messages
spring.messages.encoding=UTF-8