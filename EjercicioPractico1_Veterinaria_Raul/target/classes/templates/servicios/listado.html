<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <nav th:replace="~{general/fragmentos :: navbar}"></nav>

        <main class="container my-5">

            <h2 class="text-success mb-4">
                <i class="bi bi-heart-pulse"></i>
                Servicios Veterinarios
            </h2>

            <div class="card shadow-sm">

                <div class="card-header bg-success text-white">
                    Listado de Servicios
                </div>

                <div class="card-body">

                    <table class="table table-striped table-hover">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Duración</th>
                                <th>Tipo de Servicio</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="servicio : ${servicios}">

                                <td th:text="${servicio.id}"></td>

                                <td th:text="${servicio.nombre}"></td>

                                <td th:text="${servicio.precio}"></td>

                                <td th:text="${servicio.duracionMinutos} + ' minutos'"></td>

                                <td th:text="${servicio.tipoServicio.nombre}"></td>

                            </tr>

                        </tbody>

                    </table>

                    <div th:if="${#lists.isEmpty(servicios)}"
                         class="alert alert-info">

                        No hay servicios veterinarios registrados.

                    </div>

                </div>

            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>

</html>
