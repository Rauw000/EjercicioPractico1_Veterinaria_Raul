<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:fragment="head">
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title th:text="#{app.titulo}">Veterinaria</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
              rel="stylesheet">
        <style>
            body {
                background-color: #f4faf8;
                font-family: Arial, sans-serif;
            }

            .navbar {
                background-color: #198754;
            }

            .navbar-brand,
            .nav-link {
                color: white !important;
            }

            .nav-link:hover {
                color: #d1f7e3 !important;
            }

            .encabezado {
                background-color: #d1e7dd;
                padding: 30px;
                text-align: center;
            }

            .pie-pagina {
                background-color: #198754;
                color: white;
                text-align: center;
                padding: 20px;
                margin-top: 40px;
            }
        </style>
    </head>

    <body>
        <header th:fragment="header" class="encabezado">

            <h1 th:text="#{app.nombre}">
                Clínica Veterinaria
            </h1>

            <p th:text="#{app.descripcion}">
                Cuidamos a tus mejores amigos
            </p>

        </header>
        
        <nav th:fragment="navbar"
             class="navbar navbar-expand-lg navbar-dark">

            <div class="container">

                <a class="navbar-brand"
                   th:href="@{/}"
                   th:text="#{nav.marca}">
                    Veterinaria
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal"
                        aria-controls="menuPrincipal"
                        aria-expanded="false"
                        aria-label="Abrir menú">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse"
                     id="menuPrincipal">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/}"
                               th:text="#{nav.inicio}">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/tipos}"
                               th:text="#{nav.tipos}">
                                Tipos de Servicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/servicios}"
                               th:text="#{nav.servicios}">
                                Servicios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/citas}"
                               th:text="#{nav.citas}">
                                Citas
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/contacto}"
                               th:text="#{nav.contacto}">
                                Contacto
                            </a>
                        </li>

                    </ul>
                </div>
            </div>
        </nav>
        
        <footer th:fragment="footer" class="pie-pagina">

            <p class="mb-0" th:text="#{footer.texto}">
                Clínica Veterinaria
            </p>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
            </script>

        </footer>

    </body>
</html>
